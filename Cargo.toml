[package]
name = "vision-ext"
version = "0.1.0"
edition = "2021"
description = "工业视觉智能 HTTP 服务（基于 rust-onnx-infer）"
license = "MIT"

[features]
cuda = ["rust-onnx-infer/cuda"]

[dependencies]
# 上游 javpower/rust-onnx-infer 的 viccom fork(本地 api-26 + resize 卷积修复两补丁)。
# path 依赖只在本机可用,换 git 依赖消除单点:fork 是独立 GitHub 仓库,CI/他机可复现。
# 具体 commit 由 Cargo.lock 锁定;rust-onnx-infer 改动后 push → `cargo update -p rust-onnx-infer`。
rust-onnx-infer = { git = "https://github.com/viccom/rust-onnx-infer.git", branch = "master", default-features = false, features = ["load-dynamic"] }
axum = { version = "0.8", features = ["multipart", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
