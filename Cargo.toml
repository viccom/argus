[package]
name = "argus"
version = "0.1.0"
edition = "2021"
description = "工业视觉智能 HTTP 服务（基于 rust-onnx-infer）"
license = "MIT"

[features]
cuda = ["rust-onnx-infer/cuda"]

[dependencies]
# 上游 javpower/rust-onnx-infer 的 viccom fork(本地 api-26 + resize 卷积修复两补丁)。
# path 依赖只在本机可用,换 git 依赖消除单点:fork 是独立 GitHub 仓库,CI/他机可复现。
# 具体 commit 由 Cargo.lock 锁定;rust-onnx-infer 改动后 push → `cargo update -p rust-onnx-infer`。
rust-onnx-infer = { git = "https://github.com/viccom/rust-onnx-infer.git", branch = "master", default-features = false, features = ["load-dynamic"] }
axum = { version = "0.8", features = ["multipart", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
sha2 = "0.10"
# 进程内指标导出(D3,05-metrics-spec §4.5):OTLP/HTTP protobuf 直推 collector :4318,
# fanout/collector 只收 HTTP+protobuf(05 §1);blocking client 避开嵌套 runtime 坑。
# 隔离在 src/otel_metrics.rs 单模块,OTEL_EXPORTER_OTLP_ENDPOINT 空=全 no-op(R3.5)。
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client", "metrics"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# 单测读内存导出器断言指标名/属性/落桶(07-tdd §3.2)
opentelemetry_sdk = { version = "0.33", features = ["testing"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
